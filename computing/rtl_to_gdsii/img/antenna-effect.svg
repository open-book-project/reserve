<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 330" width="990" height="330" role="img" aria-label="The antenna effect and its two cures"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d594a"/></marker></defs><rect x="0" y="0" width="990" height="330" fill="#ffffff"/><g font-family="'Segoe UI', Helvetica, Arial, sans-serif"><text x="160" y="28" font-size="14" fill="#b3402f" text-anchor="middle" font-weight="bold">Problem</text><text x="470" y="28" font-size="14" fill="#2f5f9a" text-anchor="middle" font-weight="bold">Cure 1: layer jump</text><text x="800" y="28" font-size="14" fill="#3b7d3e" text-anchor="middle" font-weight="bold">Cure 2: antenna diode</text><rect x="30" y="140" width="250" height="12" rx="0" fill="#fbf0d4" stroke="#b5811a" stroke-width="1.5" /><text x="155" y="176" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">long metal wire, etched in plasma</text><text x="55" y="126" font-size="16" fill="#b3402f" text-anchor="middle" font-weight="bold">+</text><text x="105" y="126" font-size="16" fill="#b3402f" text-anchor="middle" font-weight="bold">+</text><text x="155" y="126" font-size="16" fill="#b3402f" text-anchor="middle" font-weight="bold">+</text><text x="205" y="126" font-size="16" fill="#b3402f" text-anchor="middle" font-weight="bold">+</text><text x="255" y="126" font-size="16" fill="#b3402f" text-anchor="middle" font-weight="bold">+</text><line x1="250" y1="152" x2="250" y2="200" stroke="#b5811a" stroke-width="3"/><rect x="225" y="200" width="50" height="16" rx="0" fill="#eee6f5" stroke="#6b4a8a" stroke-width="1.5" /><text x="250" y="212" font-size="10" fill="#6b4a8a" text-anchor="middle" font-weight="normal">gate</text><rect x="205" y="216" width="90" height="22" rx="0" fill="#efede6" stroke="#8a8677" stroke-width="1.2" /><text x="250" y="232" font-size="9.5" fill="#5d594a" text-anchor="middle" font-weight="normal">oxide on silicon</text><text x="155" y="280" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">charge piles up on the wire and has only</text><text x="155" y="296" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">the thin gate oxide to escape through</text><rect x="340" y="150" width="110" height="12" rx="0" fill="#fbf0d4" stroke="#b5811a" stroke-width="1.5" /><rect x="450" y="100" width="60" height="12" rx="0" fill="#e2ecf8" stroke="#2f5f9a" stroke-width="1.5" /><rect x="510" y="150" width="100" height="12" rx="0" fill="#fbf0d4" stroke="#b5811a" stroke-width="1.5" /><line x1="445" y1="150" x2="445" y2="112" stroke="#3b7d3e" stroke-width="3"/><line x1="515" y1="112" x2="515" y2="150" stroke="#3b7d3e" stroke-width="3"/><line x1="590" y1="162" x2="590" y2="200" stroke="#b5811a" stroke-width="3"/><rect x="565" y="200" width="50" height="16" rx="0" fill="#eee6f5" stroke="#6b4a8a" stroke-width="1.5" /><text x="590" y="212" font-size="10" fill="#6b4a8a" text-anchor="middle" font-weight="normal">gate</text><rect x="545" y="216" width="90" height="22" rx="0" fill="#efede6" stroke="#8a8677" stroke-width="1.2" /><text x="590" y="232" font-size="9.5" fill="#5d594a" text-anchor="middle" font-weight="normal">oxide on silicon</text><text x="470" y="76" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">the run goes up to a higher layer and back</text><text x="470" y="280" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">each layer is etched separately, so less</text><text x="470" y="296" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">metal is exposed during any one etch</text><rect x="670" y="140" width="250" height="12" rx="0" fill="#fbf0d4" stroke="#b5811a" stroke-width="1.5" /><line x1="900" y1="152" x2="900" y2="200" stroke="#b5811a" stroke-width="3"/><rect x="875" y="200" width="50" height="16" rx="0" fill="#eee6f5" stroke="#6b4a8a" stroke-width="1.5" /><text x="900" y="212" font-size="10" fill="#6b4a8a" text-anchor="middle" font-weight="normal">gate</text><rect x="855" y="216" width="90" height="22" rx="0" fill="#efede6" stroke="#8a8677" stroke-width="1.2" /><text x="900" y="232" font-size="9.5" fill="#5d594a" text-anchor="middle" font-weight="normal">oxide on silicon</text><line x1="840" y1="152" x2="840" y2="190" stroke="#3b7d3e" stroke-width="2.5"/><path d="M830 190 H850 L840 206 Z" fill="#e3f1e1" stroke="#3b7d3e" stroke-width="1.8"/><line x1="830" y1="208" x2="850" y2="208" stroke="#3b7d3e" stroke-width="2"/><line x1="840" y1="208" x2="840" y2="232" stroke="#3b7d3e" stroke-width="2"/><text x="790" y="248" font-size="11.5" fill="#3b7d3e" text-anchor="middle" font-weight="bold">diode to substrate</text><text x="790" y="280" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">a small diode near the gate bleeds the</text><text x="790" y="296" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">charge away before it can do damage</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" role="img" aria-label="A register-to-register timing path"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d594a"/></marker></defs><rect x="0" y="0" width="860" height="260" fill="#ffffff"/><g font-family="'Segoe UI', Helvetica, Arial, sans-serif"><rect x="40" y="90" width="130" height="90" rx="8" fill="#fbf0d4" stroke="#b5811a" stroke-width="1.8" /><text x="105.0" y="132.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">Launch</text><text x="105.0" y="150.0" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">flip-flop</text><rect x="690" y="90" width="130" height="90" rx="8" fill="#fbf0d4" stroke="#b5811a" stroke-width="1.8" /><text x="755.0" y="132.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">Capture</text><text x="755.0" y="150.0" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">flip-flop</text><path d="M260 135 C250 90 300 80 330 95 C350 70 410 70 430 95 C470 80 520 95 515 130 C540 150 520 195 480 190 C460 215 400 215 380 195 C340 215 290 205 290 185 C255 185 245 150 260 135 Z" stroke="#2f7a6d" stroke-width="1.8" fill="#dff0ec"/><text x="388" y="135" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">combinational logic</text><text x="388" y="155" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">gates and wires</text><line x1="170" y1="135" x2="262" y2="135" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><text x="215" y="125" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">Q</text><line x1="515" y1="135" x2="690" y2="135" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><text x="600" y="125" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">D</text><line x1="105" y1="40" x2="105" y2="90" stroke="#b3402f" stroke-width="1.8" marker-end="url(#ar)"/><line x1="755" y1="40" x2="755" y2="90" stroke="#b3402f" stroke-width="1.8" marker-end="url(#ar)"/><line x1="105" y1="40" x2="755" y2="40" stroke="#b3402f" stroke-width="1.8"/><text x="430" y="30" font-size="13" fill="#b3402f" text-anchor="middle" font-weight="bold">the same clock reaches both flip-flops</text><text x="105" y="215" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">sends a new value</text><text x="105" y="232" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">after the clock edge</text><text x="755" y="215" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">must see it settled before</text><text x="755" y="232" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">the next edge (setup)</text></g></svg>
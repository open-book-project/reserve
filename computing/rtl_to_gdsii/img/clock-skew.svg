<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Clock latency and skew for two flip-flops"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d594a"/></marker></defs><rect x="0" y="0" width="900" height="300" fill="#ffffff"/><g font-family="'Segoe UI', Helvetica, Arial, sans-serif"><text x="450" y="26" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">Latency to FF_A is 412 ps and to FF_B is 468 ps: skew +56 ps</text><line x1="150" y1="80" x2="150" y2="250" stroke="#2b2a22" stroke-width="2"/><text x="150" y="70" font-size="12" fill="#2b2a22" text-anchor="start" font-weight="bold">clock source edge</text><line x1="706.2" y1="100" x2="706.2" y2="200" stroke="#2f7a6d" stroke-width="2"/><line x1="781.8000000000001" y1="130" x2="781.8000000000001" y2="230" stroke="#2f5f9a" stroke-width="2"/><text x="142" y="119" font-size="12" fill="#2f7a6d" text-anchor="end" font-weight="bold">FF_A clk pin</text><text x="142" y="169" font-size="12" fill="#2f5f9a" text-anchor="end" font-weight="bold">FF_B clk pin</text><line x1="150" y1="115" x2="706.2" y2="115" stroke="#2f7a6d" stroke-width="2.5" marker-end="url(#ar)"/><text x="428.1" y="106" font-size="12" fill="#2f7a6d" text-anchor="middle" font-weight="bold">412 ps</text><line x1="150" y1="165" x2="781.8000000000001" y2="165" stroke="#2f5f9a" stroke-width="2.5" marker-end="url(#ar)"/><text x="465.90000000000003" y="156" font-size="12" fill="#2f5f9a" text-anchor="middle" font-weight="bold">468 ps</text><line x1="706.2" y1="215" x2="781.8000000000001" y2="215" stroke="#b3402f" stroke-width="3" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="744.0" y="240" font-size="13" fill="#b3402f" text-anchor="middle" font-weight="bold">skew +56 ps</text><text x="450" y="282" font-size="12.5" fill="#5d594a" text-anchor="middle" font-weight="normal">positive skew: capture clock later than launch. Helps setup, hurts hold.</text></g></svg>
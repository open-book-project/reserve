<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="A metal-1 spacing rule: 0.14 um minimum"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d594a"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><g font-family="'Segoe UI', Helvetica, Arial, sans-serif"><rect x="60" y="90" width="260" height="60.0" rx="0" fill="#dff0ec" stroke="#2f7a6d" stroke-width="1.8" /><rect x="60" y="192.0" width="260" height="60.0" rx="0" fill="#dff0ec" stroke="#2f7a6d" stroke-width="1.8" /><line x1="335" y1="150.0" x2="335" y2="192.0" stroke="#2b2a22" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="345" y="175.0" font-size="12.5" fill="#2f7a6d" text-anchor="start" font-weight="bold">0.14 um</text><line x1="46" y1="90" x2="46" y2="150.0" stroke="#5d594a" stroke-width="1.2" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="40" y="124.0" font-size="10.5" fill="#5d594a" text-anchor="end" font-weight="normal">0.20</text><rect x="500" y="90" width="260" height="60.0" rx="0" fill="#f8e1dc" stroke="#b3402f" stroke-width="1.8" /><rect x="500" y="180.0" width="260" height="60.0" rx="0" fill="#f8e1dc" stroke="#b3402f" stroke-width="1.8" /><line x1="775" y1="150.0" x2="775" y2="180.0" stroke="#2b2a22" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="785" y="169.0" font-size="12.5" fill="#b3402f" text-anchor="start" font-weight="bold">0.10 um</text><line x1="486" y1="90" x2="486" y2="150.0" stroke="#5d594a" stroke-width="1.2" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="480" y="124.0" font-size="10.5" fill="#5d594a" text-anchor="end" font-weight="normal">0.20</text><text x="190" y="60" font-size="14" fill="#3b7d3e" text-anchor="middle" font-weight="bold">spacing 0.14 um: clean</text><text x="630" y="60" font-size="14" fill="#b3402f" text-anchor="middle" font-weight="bold">spacing 0.10 um: violation (met1.2)</text><text x="190" y="290" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">the foundry guarantees these two wires print as two</text><text x="190" y="306" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">(width 0.20 um, above the 0.14 um minimum)</text><text x="630" y="290" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">the two wires may print as one: a short</text><text x="630" y="306" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">Magic: "Metal1 spacing &lt; 0.14um (met1.2)"</text></g></svg>
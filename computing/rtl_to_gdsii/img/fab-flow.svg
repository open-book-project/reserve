<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="What the foundry does with the GDSII file"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d594a"/></marker></defs><rect x="0" y="0" width="1000" height="230" fill="#ffffff"/><g font-family="'Segoe UI', Helvetica, Arial, sans-serif"><rect x="20" y="80" width="140" height="76" rx="8" fill="#e3f1e1" stroke="#3b7d3e" stroke-width="1.8" /><text x="90.0" y="115.0" font-size="13" fill="#2b2a22" text-anchor="middle" font-weight="bold">GDSII / OASIS</text><text x="90.0" y="133.0" font-size="11" fill="#5d594a" text-anchor="middle" font-weight="normal">the layout</text><line x1="160" y1="118" x2="182" y2="118" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><rect x="182" y="80" width="140" height="76" rx="8" fill="#fbf0d4" stroke="#b5811a" stroke-width="1.8" /><text x="252.0" y="115.0" font-size="13" fill="#2b2a22" text-anchor="middle" font-weight="bold">Mask data prep</text><text x="252.0" y="133.0" font-size="11" fill="#5d594a" text-anchor="middle" font-weight="normal">split and correct shapes</text><line x1="322" y1="118" x2="344" y2="118" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><rect x="344" y="80" width="140" height="76" rx="8" fill="#fbf0d4" stroke="#b5811a" stroke-width="1.8" /><text x="414.0" y="115.0" font-size="13" fill="#2b2a22" text-anchor="middle" font-weight="bold">Photomasks</text><text x="414.0" y="133.0" font-size="11" fill="#5d594a" text-anchor="middle" font-weight="normal">one or more per layer</text><line x1="484" y1="118" x2="506" y2="118" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><rect x="506" y="80" width="140" height="76" rx="8" fill="#e2ecf8" stroke="#2f5f9a" stroke-width="1.8" /><text x="576.0" y="115.0" font-size="13" fill="#2b2a22" text-anchor="middle" font-weight="bold">Lithography</text><text x="576.0" y="133.0" font-size="11" fill="#5d594a" text-anchor="middle" font-weight="normal">light through each mask</text><line x1="646" y1="118" x2="668" y2="118" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><rect x="668" y="80" width="140" height="76" rx="8" fill="#e2ecf8" stroke="#2f5f9a" stroke-width="1.8" /><text x="738.0" y="115.0" font-size="13" fill="#2b2a22" text-anchor="middle" font-weight="bold">Etch, deposit, polish</text><text x="738.0" y="133.0" font-size="11" fill="#5d594a" text-anchor="middle" font-weight="normal">repeat for every layer</text><line x1="808" y1="118" x2="830" y2="118" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><rect x="830" y="80" width="140" height="76" rx="8" fill="#e3f1e1" stroke="#3b7d3e" stroke-width="1.8" /><text x="900.0" y="115.0" font-size="13" fill="#2b2a22" text-anchor="middle" font-weight="bold">Dice, package, test</text><text x="900.0" y="133.0" font-size="11" fill="#5d594a" text-anchor="middle" font-weight="normal">and silicon exists</text><text x="500" y="40" font-size="15" fill="#2b2a22" text-anchor="middle" font-weight="bold">Tapeout is the moment the final data is sent on its way</text><text x="500" y="196" font-size="12.5" fill="#5d594a" text-anchor="middle" font-weight="normal">(the name dates from layouts shipped on reels of magnetic tape)</text></g></svg>
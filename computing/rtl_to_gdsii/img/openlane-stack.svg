<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="The open-source stack driven by OpenLANE"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d594a"/></marker></defs><rect x="0" y="0" width="940" height="470" fill="#ffffff"/><g font-family="'Segoe UI', Helvetica, Arial, sans-serif"><rect x="30" y="50" width="880" height="64" rx="10" fill="#fbf0d4" stroke="#b5811a" stroke-width="2" /><text x="470" y="80" font-size="15" fill="#2b2a22" text-anchor="middle" font-weight="bold">OpenLANE: the orchestrator (config, order of steps, reports, run folders)</text><text x="470" y="100" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">drives every tool below; it does no synthesis or routing itself</text><rect x="30" y="150" width="170" height="150" rx="8" fill="#fbf0d4" stroke="#b5811a" stroke-width="1.8" /><text x="115.0" y="222.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">Yosys + abc</text><text x="115.0" y="240.0" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">logic synthesis</text><text x="115" y="260" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">RTL to netlist</text><text x="115" y="278" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">in Sky130 cells</text><rect x="225" y="150" width="370" height="150" rx="10" fill="#e2ecf8" stroke="#2f5f9a" stroke-width="2" /><text x="410" y="174" font-size="15" fill="#2b2a22" text-anchor="middle" font-weight="bold">OpenROAD</text><rect x="240" y="190" width="168" height="28" rx="4" fill="#fff" stroke="#2f5f9a" stroke-width="1.2" /><text x="324" y="209" font-size="11.5" fill="#2b2a22" text-anchor="middle" font-weight="normal">floorplan, PDN</text><rect x="412" y="190" width="168" height="28" rx="4" fill="#fff" stroke="#2f5f9a" stroke-width="1.2" /><text x="496" y="209" font-size="11.5" fill="#2b2a22" text-anchor="middle" font-weight="normal">placement (RePlAce)</text><rect x="240" y="226" width="168" height="28" rx="4" fill="#fff" stroke="#2f5f9a" stroke-width="1.2" /><text x="324" y="245" font-size="11.5" fill="#2b2a22" text-anchor="middle" font-weight="normal">TritonCTS</text><rect x="412" y="226" width="168" height="28" rx="4" fill="#fff" stroke="#2f5f9a" stroke-width="1.2" /><text x="496" y="245" font-size="11.5" fill="#2b2a22" text-anchor="middle" font-weight="normal">FastRoute, TritonRoute</text><rect x="240" y="262" width="168" height="28" rx="4" fill="#fff" stroke="#2f5f9a" stroke-width="1.2" /><text x="324" y="281" font-size="11.5" fill="#2b2a22" text-anchor="middle" font-weight="normal">OpenRCX (SPEF)</text><rect x="412" y="262" width="168" height="28" rx="4" fill="#fff" stroke="#2f5f9a" stroke-width="1.2" /><text x="496" y="281" font-size="11.5" fill="#2b2a22" text-anchor="middle" font-weight="normal">OpenSTA (timing)</text><rect x="620" y="150" width="130" height="150" rx="8" fill="#e3f1e1" stroke="#3b7d3e" stroke-width="1.8" /><text x="685.0" y="222.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">Magic</text><text x="685.0" y="240.0" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">layout, DRC,</text><text x="685" y="258" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">GDS stream-out,</text><text x="685" y="276" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">extraction</text><rect x="770" y="150" width="140" height="70" rx="8" fill="#eee6f5" stroke="#6b4a8a" stroke-width="1.8" /><text x="840.0" y="182.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">KLayout</text><text x="840.0" y="200.0" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">view, second DRC</text><rect x="770" y="230" width="140" height="70" rx="8" fill="#eee6f5" stroke="#6b4a8a" stroke-width="1.8" /><text x="840.0" y="262.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">netgen</text><text x="840.0" y="280.0" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">LVS</text><rect x="30" y="340" width="880" height="56" rx="10" fill="#efede6" stroke="#8a8677" stroke-width="2" /><text x="470" y="364" font-size="15" fill="#2b2a22" text-anchor="middle" font-weight="bold">Sky130A PDK (the target process)</text><text x="470" y="383" font-size="12" fill="#5d594a" text-anchor="middle" font-weight="normal">.lib timing, .lef shapes, design rules, standard-cell library sky130_fd_sc_hd, cell layouts</text><line x1="470" y1="114" x2="470" y2="150" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><line x1="470" y1="300" x2="470" y2="340" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><text x="470" y="430" font-size="12.5" fill="#5d594a" text-anchor="middle" font-weight="normal">Think of a compiler: Yosys is the front end, OpenROAD the back end and optimiser,</text><text x="470" y="448" font-size="12.5" fill="#5d594a" text-anchor="middle" font-weight="normal">OpenLANE the make that runs the passes, Sky130 the target machine.</text></g></svg>
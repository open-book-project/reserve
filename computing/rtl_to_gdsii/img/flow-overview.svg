<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="The eight stages of the RTL-to-GDSII flow"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d594a"/></marker></defs><rect x="0" y="0" width="960" height="430" fill="#ffffff"/><g font-family="'Segoe UI', Helvetica, Arial, sans-serif"><rect x="30" y="70" width="200" height="84" rx="8" fill="#fbf0d4" stroke="#b5811a" stroke-width="1.8" /><text x="130.0" y="109.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">1  RTL and verification</text><text x="130.0" y="127.0" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">spec to .v + testbench</text><rect x="270" y="70" width="200" height="84" rx="8" fill="#fbf0d4" stroke="#b5811a" stroke-width="1.8" /><text x="370.0" y="109.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">2  Logic synthesis</text><text x="370.0" y="127.0" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">RTL + .sdc + .lib to netlist</text><rect x="510" y="70" width="200" height="84" rx="8" fill="#e2ecf8" stroke="#2f5f9a" stroke-width="1.8" /><text x="610.0" y="109.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">3  Floorplan and power</text><text x="610.0" y="127.0" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">netlist + .lef to die, PDN</text><rect x="750" y="70" width="200" height="84" rx="8" fill="#e2ecf8" stroke="#2f5f9a" stroke-width="1.8" /><text x="850.0" y="109.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">4  Placement</text><text x="850.0" y="127.0" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">floorplan to placed .def</text><rect x="30" y="260" width="200" height="84" rx="8" fill="#e2ecf8" stroke="#2f5f9a" stroke-width="1.8" /><text x="130.0" y="299.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">5  Clock tree (CTS)</text><text x="130.0" y="317.0" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">placed to balanced clock</text><rect x="270" y="260" width="200" height="84" rx="8" fill="#e2ecf8" stroke="#2f5f9a" stroke-width="1.8" /><text x="370.0" y="299.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">6  Routing</text><text x="370.0" y="317.0" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">placed to routed .def</text><rect x="510" y="260" width="200" height="84" rx="8" fill="#e2ecf8" stroke="#2f5f9a" stroke-width="1.8" /><text x="610.0" y="299.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">7  Extraction and STA</text><text x="610.0" y="317.0" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">routed to .spef + reports</text><rect x="750" y="260" width="200" height="84" rx="8" fill="#e3f1e1" stroke="#3b7d3e" stroke-width="1.8" /><text x="850.0" y="299.0" font-size="14" fill="#2b2a22" text-anchor="middle" font-weight="bold">8  Verification, GDSII</text><text x="850.0" y="317.0" font-size="11.5" fill="#5d594a" text-anchor="middle" font-weight="normal">layout to .gds (DRC, LVS)</text><line x1="230" y1="112.0" x2="270" y2="112.0" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><line x1="470" y1="112.0" x2="510" y2="112.0" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><line x1="710" y1="112.0" x2="750" y2="112.0" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><path d="M850.0 154 V204 H130.0 V260" stroke="#5d594a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><line x1="230" y1="302.0" x2="270" y2="302.0" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><line x1="470" y1="302.0" x2="510" y2="302.0" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><line x1="710" y1="302.0" x2="750" y2="302.0" stroke="#5d594a" stroke-width="1.8" marker-end="url(#ar)"/><text x="30" y="38" font-size="14" fill="#b5811a" text-anchor="start" font-weight="bold">Front end: what the logic is</text><text x="510" y="38" font-size="14" fill="#2f5f9a" text-anchor="start" font-weight="bold">Back end: where it goes, and does it still work</text><line x1="30" y1="48" x2="470" y2="48" stroke="#b5811a" stroke-width="3"/><line x1="510" y1="48" x2="950" y2="48" stroke="#2f5f9a" stroke-width="3"/><text x="30" y="386" font-size="12.5" fill="#5d594a" text-anchor="start" font-weight="bold">Inputs held by the flow throughout:</text><text x="30" y="408" font-size="12.5" fill="#5d594a" text-anchor="start" font-weight="normal">.sdc (constraints)  |  .lib (cell timing and power)  |  .lef (cell shapes, metal rules)  |  PDK rules for DRC and LVS</text></g></svg>